<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>WEIMAR 联机界面验收</title>
    <style>
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      body > #app {
        flex: 1;
        height: auto;
        min-height: 0;
      }
      .fixture-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 5px 12px;
        background: #ffeaba;
        font-size: 11px;
      }
      .fixture-toolbar label {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .fixture-toolbar select {
        width: auto;
        margin: 0;
        padding: 3px;
      }
    </style>
  </head>
  <body>
    <section class="fixture-toolbar">
      <strong>仅联机界面验收 · 模拟Steam，不是真实联网</strong>
      <label
        >当前测试玩家<select id="fixture-peer">
          <option value="1001">房主 / Coalition</option>
          <option value="1002">玩家2 / KPD</option>
          <option value="1003">玩家3 / NSDAP</option>
          <option value="1004">玩家4 / RC</option>
        </select></label
      >
      <button id="fixture-disconnect">切换玩家2在线状态</button>
    </section>
    <div id="app"></div>
    <script type="module" src="./steam-ui.ts"></script>
  </body>
</html>
